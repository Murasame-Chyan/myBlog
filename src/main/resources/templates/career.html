<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求职进度 — MyBlog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/career.css?v=1">
</head>
<body>
    <header th:replace="~{fragment/header :: nav('career')}"></header>

    <main class="container-fluid career-main">
        <div class="career-container">

            <!-- ===== 1. 页头 ===== -->
            <section class="career-page-head">
                <div>
                    <h1 class="career-title">
                        求职进度
                        <span class="career-title-badge">MovingOn</span>
                    </h1>
                    <p class="career-subtitle">记录每一次投递、笔试与面试，跟进不遗漏</p>
                </div>
                <button type="button" class="career-btn career-btn-primary" id="btnNewApplication">
                    <i class="bi bi-plus-lg"></i> 新增投递
                </button>
            </section>

            <!-- ===== 2. 统计卡 ===== -->
            <section class="career-stats" id="statsCards">
                <div class="career-stat-card">
                    <span class="career-stat-label">总投递</span>
                    <strong class="career-stat-value" id="statTotal">0</strong>
                </div>
                <div class="career-stat-card is-accent">
                    <span class="career-stat-label">沟通中</span>
                    <strong class="career-stat-value" id="statCommunicating">0</strong>
                </div>
                <div class="career-stat-card is-warn">
                    <span class="career-stat-label">面试中</span>
                    <strong class="career-stat-value" id="statInterviewing">0</strong>
                </div>
                <div class="career-stat-card is-success">
                    <span class="career-stat-label">Offer</span>
                    <strong class="career-stat-value" id="statOffer">0</strong>
                </div>
                <div class="career-stat-card is-danger">
                    <span class="career-stat-label">拒绝</span>
                    <strong class="career-stat-value" id="statRejected">0</strong>
                </div>
                <div class="career-stat-card is-danger-soft">
                    <span class="career-stat-label">逾期跟进</span>
                    <strong class="career-stat-value" id="statOverdue">0</strong>
                </div>
            </section>

            <!-- ===== 3. 置顶分组：今日跟进 / 逾期跟进 ===== -->
            <section class="career-groups">
                <div class="career-group" id="groupDueToday">
                    <button type="button" class="career-group-head" id="toggleDueToday" aria-expanded="true">
                        <span class="career-group-title"><i class="bi bi-alarm"></i> 今日跟进</span>
                        <span class="career-group-count" id="dueTodayCount">0</span>
                        <i class="bi bi-chevron-down career-group-arrow"></i>
                    </button>
                    <div class="career-group-body" id="dueTodayList"></div>
                    <div class="career-group-empty" id="dueTodayEmpty">今天没有需要跟进的投递</div>
                </div>

                <div class="career-group career-group-overdue" id="groupOverdue">
                    <button type="button" class="career-group-head" id="toggleOverdue" aria-expanded="true">
                        <span class="career-group-title"><i class="bi bi-exclamation-triangle"></i> 逾期跟进</span>
                        <span class="career-group-count" id="overdueCount">0</span>
                        <i class="bi bi-chevron-down career-group-arrow"></i>
                    </button>
                    <div class="career-group-body" id="overdueList"></div>
                    <div class="career-group-empty" id="overdueEmpty">没有逾期的投递，保持住</div>
                </div>
            </section>

            <!-- ===== 4. 工具栏 ===== -->
            <section class="career-toolbar">
                <div class="career-field career-field-search">
                    <i class="bi bi-search"></i>
                    <input type="text" id="keywordInput" placeholder="搜索公司 / 岗位" maxlength="100" autocomplete="off">
                </div>
                <select id="statusFilter" class="career-select" aria-label="状态筛选">
                    <option value="">全部状态</option>
                    <option th:each="opt : ${statusOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
                </select>
                <select id="channelFilter" class="career-select" aria-label="渠道筛选">
                    <option value="">全部渠道</option>
                    <option th:each="opt : ${channelOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
                </select>
                <label class="career-check">
                    <input type="checkbox" id="overdueOnly"> 只看逾期
                </label>
                <select id="sortBy" class="career-select" aria-label="排序">
                    <option value="">最新投递</option>
                    <option value="followUp">按跟进日期</option>
                    <option value="updated">按最近更新</option>
                </select>
                <button type="button" class="career-btn" id="btnSearch">查询</button>
                <button type="button" class="career-btn career-btn-ghost" id="btnReset">重置</button>
            </section>
            <p class="career-total-text" id="listTotalText"></p>

            <!-- ===== 5. 列表 ===== -->
            <section class="career-list-wrap">
                <div class="career-loading" id="listLoading" hidden>加载中…</div>

                <div class="career-empty" id="listEmpty" hidden>
                    <i class="bi bi-inbox"></i>
                    <p>还没有投递记录，点右上角「新增投递」开始记录</p>
                </div>

                <div class="career-table-wrap">
                    <table class="career-table">
                        <thead>
                            <tr>
                                <th>公司 / 岗位</th>
                                <th>渠道</th>
                                <th>状态</th>
                                <th>投递日期</th>
                                <th>跟进日期</th>
                                <th>已投</th>
                                <th class="career-th-actions">操作</th>
                            </tr>
                        </thead>
                        <tbody id="applicationTableBody"></tbody>
                    </table>
                </div>

                <div class="career-cards" id="applicationCardList"></div>

                <nav class="career-pagination" id="pagination" aria-label="分页"></nav>
            </section>
        </div>
    </main>

    <!-- ===== 6. 抽屉遮罩 ===== -->
    <div class="career-drawer-mask" id="drawerMask" hidden></div>

    <!-- ===== 7. 抽屉（新增 / 详情共用，由 JS 切换模式） ===== -->
    <aside class="career-drawer" id="detailDrawer" hidden aria-label="投递详情">
        <header class="career-drawer-head">
            <h2 class="career-drawer-title" id="drawerTitle">新增投递</h2>
            <button type="button" class="career-drawer-close" id="btnCloseDrawer" aria-label="关闭">&times;</button>
        </header>

        <div class="career-drawer-body">
            <!-- 详情模式：派生信息 -->
            <div class="career-detail-only" id="detailMeta"></div>

            <!-- 主表单 -->
            <form id="applicationForm" autocomplete="off">
                <div class="career-form-grid">
                    <label class="career-form-item career-span-2">公司 *
                        <input type="text" id="companyInput" maxlength="100" required>
                    </label>
                    <label class="career-form-item career-span-2">岗位 *
                        <input type="text" id="positionInput" maxlength="100" required>
                    </label>
                    <label class="career-form-item">投递渠道 *
                        <select id="channelSelect" required>
                            <option th:each="opt : ${channelOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
                        </select>
                    </label>
                    <label class="career-form-item">投递日期 *
                        <input type="date" id="appliedAtInput" required>
                    </label>
                    <label class="career-form-item career-create-only career-span-2">初始状态
                        <select id="statusInput">
                            <option th:each="opt : ${statusOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
                        </select>
                    </label>
                </div>

                <details class="career-advanced">
                    <summary>更多字段（城市 / 薪资 / 优先级 / 跟进日期 / 下一步 / 联系方式 / 简历版本 / JD 链接 / 备注）</summary>
                    <div class="career-form-grid">
                        <label class="career-form-item">城市
                            <input type="text" id="locationInput" maxlength="50">
                        </label>
                        <label class="career-form-item">薪资区间
                            <input type="text" id="salaryRangeInput" maxlength="50" placeholder="如 300-400/天">
                        </label>
                        <label class="career-form-item">优先级
                            <select id="prioritySelect">
                                <option th:each="opt : ${priorityOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
                            </select>
                        </label>
                        <label class="career-form-item">下次跟进日期
                            <input type="date" id="followUpAtInput">
                        </label>
                        <label class="career-form-item career-span-2">下一步动作
                            <input type="text" id="nextActionInput" maxlength="200" placeholder="如：等笔试通知 / 准备项目介绍">
                        </label>
                        <label class="career-form-item">联系方式
                            <input type="text" id="contactInput" maxlength="100">
                        </label>
                        <label class="career-form-item">简历版本
                            <input type="text" id="resumeVersionInput" maxlength="50">
                        </label>
                        <label class="career-form-item career-span-2">JD 链接
                            <input type="text" id="jobUrlInput" maxlength="500" placeholder="https://">
                        </label>
                        <label class="career-form-item career-span-2">备注
                            <textarea id="notesInput" rows="3" maxlength="2000"></textarea>
                        </label>
                    </div>
                </details>

                <div class="career-form-actions">
                    <button type="submit" class="career-btn career-btn-primary" id="btnSaveApplication">保存</button>
                    <button type="button" class="career-btn career-btn-ghost" id="btnCancelDrawer">取消</button>
                </div>
            </form>

            <!-- 详情模式：状态操作 -->
            <section class="career-detail-only career-section">
                <h3 class="career-section-title">修改状态</h3>
                <div class="career-inline-form">
                    <select id="statusActionSelect" class="career-select" aria-label="目标状态">
                        <option th:each="opt : ${statusOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
                    </select>
                    <input type="text" id="statusNoteInput" maxlength="500" placeholder="变更备注（可选）">
                    <button type="button" class="career-btn" id="btnChangeStatus">更新状态</button>
                </div>
                <div class="career-quick-actions">
                    <button type="button" class="career-btn career-btn-ghost" id="btnFollowUp">
                        <i class="bi bi-alarm"></i> 跟进 +7 天
                    </button>
                    <button type="button" class="career-btn career-btn-ghost" id="btnReject">标记拒绝</button>
                    <button type="button" class="career-btn career-btn-ghost" id="btnArchive">归档</button>
                    <button type="button" class="career-btn career-btn-danger" id="btnDelete">删除</button>
                </div>
            </section>

            <!-- 详情模式：时间线 -->
            <section class="career-detail-only career-section">
                <h3 class="career-section-title">时间线</h3>
                <div class="career-timeline" id="timelineList"></div>
                <div class="career-timeline-empty" id="timelineEmpty">暂无事件</div>
            </section>

            <!-- 详情模式：添加事件 -->
            <section class="career-detail-only career-section">
                <h3 class="career-section-title">添加事件</h3>
                <form id="eventForm" autocomplete="off">
                    <div class="career-form-grid">
                        <label class="career-form-item">类型
                            <select id="eventTypeSelect">
                                <option th:each="opt : ${eventTypeOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
                            </select>
                        </label>
                        <label class="career-form-item">时间
                            <input type="datetime-local" id="eventOccurredAtInput">
                        </label>
                        <label class="career-form-item career-span-2">标题 *
                            <input type="text" id="eventTitleInput" maxlength="200" required>
                        </label>
                        <label class="career-form-item career-span-2">内容
                            <textarea id="eventContentInput" rows="2" maxlength="2000"></textarea>
                        </label>
                        <label class="career-form-item career-span-2">扩展信息（面试轮次 / 面试官等）
                            <input type="text" id="eventMetaInput" maxlength="500">
                        </label>
                    </div>
                    <div class="career-form-actions">
                        <button type="submit" class="career-btn" id="btnAddEvent">添加事件</button>
                    </div>
                </form>
            </section>
        </div>
    </aside>

    <!-- ===== 8. 脚本 ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/confirm-dialog.js"></script>
    <script src="/js/career.js?v=1"></script>

    <footer th:replace="~{fragment/footer :: footer}"></footer>
    <div th:replace="~{fragment/musicPlayer :: musicPlayer}"></div>
</body>
</html>
